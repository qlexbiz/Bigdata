networks:
  bigdata:
    driver: bridge

volumes:
  cassandra-seed-data:
  cassandra-1-data:
  cassandra-2-data:
  zeppelin-data:

services:
  # -----------------------
  # Spark
  # -----------------------
  spark-master:
    image: bitnami/spark:3.5.6
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_NO_DAEMONIZE=true
      # Optional: tune Spark UI host if needed
      # - SPARK_MASTER_HOST=spark-master
    volumes:
      - ./sparkio:/sparkio
    ports:
      - "7077:7077"   # Spark master RPC
      - "8080:8080"   # Spark master UI
    networks:
      - bigdata
    restart: unless-stopped

  spark-worker-1:
    image: bitnami/spark:3.5.6
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./sparkio:/sparkio
    depends_on:
      - spark-master
    ports:
      - "8081:8081"   # Worker UI (worker-1)
    networks:
      - bigdata
    restart: unless-stopped

  spark-worker-2:
    image: bitnami/spark:3.5.6
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./sparkio:/sparkio
    depends_on:
      - spark-master
    # UI is available within the network; map if you want it on host:
    # ports:
    #   - "8083:8081"
    networks:
      - bigdata
    restart: unless-stopped

  spark-worker-3:
    image: bitnami/spark:3.5.6
    container_name: spark-worker-3
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./sparkio:/sparkio
    depends_on:
      - spark-master
    # ports:
    #   - "8084:8081"
    networks:
      - bigdata
    restart: unless-stopped

  # -----------------------
  # Cassandra (3-node cluster)
  # -----------------------
  cassandra-seed:
    image: cassandra:4.1
    container_name: cassandra-seed
    hostname: cassandra-seed
    environment:
      - CASSANDRA_CLUSTER_NAME=demo-cluster
      - CASSANDRA_SEEDS=cassandra-seed
      - CASSANDRA_NUM_TOKENS=256
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra-seed-data:/var/lib/cassandra
    ports:
      - "9042:9042"   # CQL
      # (Optional) expose JMX if you need it:
      # - "7199:7199"
    networks:
      - bigdata
    restart: unless-stopped

  cassandra-1:
    image: cassandra:4.1
    container_name: cassandra-1
    hostname: cassandra-1
    environment:
      - CASSANDRA_CLUSTER_NAME=demo-cluster
      - CASSANDRA_SEEDS=cassandra-seed
      - CASSANDRA_NUM_TOKENS=256
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra-1-data:/var/lib/cassandra
    depends_on:
      - cassandra-seed
    networks:
      - bigdata
    restart: unless-stopped

  cassandra-2:
    image: cassandra:4.1
    container_name: cassandra-2
    hostname: cassandra-2
    environment:
      - CASSANDRA_CLUSTER_NAME=demo-cluster
      - CASSANDRA_SEEDS=cassandra-seed
      - CASSANDRA_NUM_TOKENS=256
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra-2-data:/var/lib/cassandra
    depends_on:
      - cassandra-seed
    networks:
      - bigdata
    restart: unless-stopped

  # -----------------------
  # Zeppelin
  # -----------------------
  zeppelin:
    image: apache/zeppelin:0.12.0
    environment:
      - MASTER=spark://spark-master:7077
      - SPARK_HOME=/opt/spark
    volumes:
      - ./sparkio:/sparkio
      - ./opt/spark-3.5.6-bin-hadoop3:/opt/spark:ro
      - zeppelin-data:/zeppelin
    ports:
      - "8082:8080"      # Zeppelin UI
      - "4040-4050:4040-4050"  # Spark app UIs from Zeppelin
    depends_on: ["spark-master"]
    networks: ["bigdata"]
